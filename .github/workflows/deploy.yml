name: Validation gestiOne

on:
  push:
    branches:
      - claude/practical-cray-gjRsH
  pull_request:
    branches:
      - claude/practical-cray-gjRsH
  workflow_dispatch:

concurrency:
  group: gestione-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Exécuter les tests
        run: npm test
