# Configuration Netlify — héberge l'application en mode serverless.
# Les fichiers statiques (public/) sont servis par le CDN ; l'API Express
# tourne dans une fonction serverless (netlify/functions/api.js).
# Données conservées dans Turso (variables TURSO_* à définir dans Netlify).

[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"
  LIBSQL_WEB = "1"

[functions]
  node_bundler = "esbuild"
  # @libsql/client est inclus depuis node_modules (évite tout souci de bundling).
  external_node_modules = ["@libsql/client"]

# Toutes les requêtes API vont vers la fonction Express.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Page de connexion dédiée par agence : /e/<slug> sert la page de connexion.
# L'URL reste propre dans le navigateur ; la page lit le slug et affiche le nom
# de l'agence (ex. /e/nouvel-afrik affiche « NOUVEL AFRIK »).
[[redirects]]
  from = "/e/*"
  to = "/login.html"
  status = 200

# Anti-cache sur l'app (HTML/JS/CSS) : le navigateur revalide à chaque chargement
# (réponse 304 si rien n'a changé), donc les utilisateurs voient toujours la
# dernière version après un déploiement, sans avoir à forcer le rafraîchissement.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
