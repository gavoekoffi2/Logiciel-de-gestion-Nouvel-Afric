<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — gestiOne</title>
  <link rel="icon" href="/assets/logo.svg" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="login-page">
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="login-logo">
      <img src="/assets/logo.svg" alt="gestiOne" class="brand-mark" />
      <h1>gestiOne</h1>
      <p>Logiciel de gestion locative immobilière</p>
    </div>

    <div id="error" class="alert alert-error" style="display:none"></div>

    <div class="field">
      <label for="email">Email, téléphone ou identifiant</label>
      <input id="email" name="email" type="text" autocomplete="username" placeholder="ex. gavoekoffi" required autofocus />
    </div>
    <div class="field">
      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
    </div>

    <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Se connecter</button>

    <p class="hint text-center" style="margin-top:18px">
      Pas encore de compte ? <a href="/register"><b>Créer mon entreprise</b></a>
    </p>
  </form>

  <script>
    // Agence dédiée : /e/<slug> (URL propre) ou ?agence=<slug>. Sinon : branding plateforme.
    (function () {
      const params = new URLSearchParams(location.search);
      let slug = (params.get('agence') || '').trim();
      const m = location.pathname.match(/\/e\/([^/]+)/i);
      if (!slug && m) slug = decodeURIComponent(m[1]);
      const url = slug ? ('/api/branding?agence=' + encodeURIComponent(slug)) : '/api/branding';
      fetch(url).then((r) => (r.ok ? r.json() : null)).then((b) => {
        if (!b || !b.entreprise) return;
        const h1 = document.querySelector('.login-logo h1');
        if (h1) h1.textContent = b.entreprise;
        if (b.agence) {
          const sub = document.querySelector('.login-logo p');
          if (sub) sub.textContent = 'Espace de gestion locative';
          const img = document.querySelector('.login-logo .brand-mark');
          if (img && b.logo) img.src = b.logo;
          if (img) img.alt = b.entreprise;
        }
        document.title = 'Connexion — ' + b.entreprise;
      }).catch(() => {});
    })();

    const form = document.getElementById('loginForm');
    const errBox = document.getElementById('error');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Connexion…';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            identifier: document.getElementById('email').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Échec de la connexion');
        window.location.href = '/';
      } catch (err) {
        errBox.textContent = err.message;
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Se connecter';
      }
    });
  </script>
</body>
</html>
